[extend]
useDefault = true

[allowlist]
description = "Repository-specific false-positive and non-code exclusions"
paths = [
  '''(^|/)node_modules(/|$)''',
  '''(^|/)\.next(/|$)''',
  '''(^|/)coverage(/|$)''',
  '''(^|/)out(/|$)''',
  '''(^|/)output(/|$)''',
  '''(^|/)logs(/|$)''',
  '''(^|/)\.claude(/|$)''',
  '''(^|/)prospects_import\.csv$''',
  '''(^|/)prospect_phones_import\.csv$''',
  '''(^|/)\.env\.example$'''
]

regexes = [
  '''\$\{\{\s*secrets\.[A-Z0-9_]+\s*\}\}''',
  '''\$\{\{\s*vars\.[A-Z0-9_]+\s*\}\}'''
]
