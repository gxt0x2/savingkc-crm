name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (git history in branch diff)
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # gitleaks-action scans the repository's entire history for a manual
      # workflow_dispatch because that event has no before/base SHA. Keep
      # manual release-gate reruns scoped to the current branch delta, matching
      # the action's normal push and pull_request behavior.
      - name: Run Gitleaks (manual branch diff)
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=/repo/results.sarif \
            --log-opts="origin/main..HEAD"

      - name: Upload manual scan results
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results-manual
          path: results.sarif
          if-no-files-found: warn
