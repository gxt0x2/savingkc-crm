name: PPC conversion export

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export queued PPC conversions
        env:
          PPC_CONVERSION_EXPORT_SECRET: ${{ secrets.PPC_CONVERSION_EXPORT_SECRET }}
          PPC_CONVERSION_EXPORT_URL: https://crm.savingkc.com/api/workers/ppc-conversion-export?limit=25
        run: |
          if [ -z "$PPC_CONVERSION_EXPORT_SECRET" ]; then
            echo "PPC_CONVERSION_EXPORT_SECRET is not configured."
            exit 1
          fi

          set +e
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${PPC_CONVERSION_EXPORT_SECRET}" \
            "${PPC_CONVERSION_EXPORT_URL}" 2>&1)"
          curl_status=$?
          set -e

          printf '%s' "$response" > ppc-export-response.txt

          if [ "$curl_status" -ne 0 ]; then
            printf '%s\n' "$response"
            exit "$curl_status"
          fi

          RESPONSE="$response" node - <<'NODE'
          const result = JSON.parse(process.env.RESPONSE || '{}')
          console.log(JSON.stringify({
            ok: result.ok,
            configured: result.configured,
            scanned: result.scanned,
            claimed: result.claimed,
            sent: result.sent,
            skipped: result.skipped,
            failed: result.failed,
            pending: result.pending,
            missingConfig: result.missingConfig,
          }))
          if (!result.ok || result.failed > 0 || (result.missingConfig || []).length > 0) {
            process.exit(1)
          }
          NODE

      - name: Alert Ernest on PPC export failure
        if: failure()
        env:
          PPC_CONVERSION_EXPORT_SECRET: ${{ secrets.PPC_CONVERSION_EXPORT_SECRET }}
          PPC_CONVERSION_EXPORT_ALERT_URL: https://crm.savingkc.com/api/workers/ppc-conversion-export-alert
        run: |
          if [ -z "$PPC_CONVERSION_EXPORT_SECRET" ]; then
            echo "PPC_CONVERSION_EXPORT_SECRET is not configured; cannot send CRM alert."
            exit 0
          fi

          payload="$(node - <<'NODE'
          const fs = require('fs')

          const response = fs.existsSync('ppc-export-response.txt')
            ? fs.readFileSync('ppc-export-response.txt', 'utf8').slice(0, 5000)
            : ''

          process.stdout.write(JSON.stringify({
            workflow: 'PPC conversion export',
            runId: process.env.GITHUB_RUN_ID,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            reason: 'Scheduled PPC conversion export failed.',
            response,
          }))
          NODE
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${PPC_CONVERSION_EXPORT_SECRET}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$PPC_CONVERSION_EXPORT_ALERT_URL" || echo "PPC export failure alert request failed."
