name: migration-version-guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: migration-version-guard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test scripts/check-migration-versions.test.mjs scripts/ci/pr-guard.test.mjs
      - name: Check migration versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/check-migration-versions.mjs
