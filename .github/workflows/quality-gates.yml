name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-mobile-dependency-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Mobile dependency, Expo, and TypeScript gate
        run: npm run gate:mobile

  gate-build-and-theme:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Canonical CRM build gate
        run: npm run gate:canonical

      - name: Code hygiene gate
        env:
          HYGIENE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run gate:hygiene

      - name: Root dependency security gate
        run: npm run gate:security

      - name: Unit coverage gate
        run: |
          npm run test:coverage
          npm run gate:kpi-coverage

      - name: Build
        run: npm run build

      - name: Performance bundle gate
        run: npm run gate:performance-bundles

      - name: Proxy registration gate
        run: npm run gate:proxy

      - name: Route integrity gate
        run: npm run gate:routes

      - name: Theme guard gate
        run: npm run gate:theme

      - name: Opportunity terminology gate
        run: npm run gate:terminology

      - name: Dialer ringback gate
        run: node scripts/ci/check-dialer-ringback.mjs

      - name: Install Playwright browser
        run: |
          # Keep Azure as a fallback, but avoid letting a reachable-yet-throttled
          # Azure Ubuntu mirror hold the Playwright gate for ~15 minutes.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              -e '/azure\.archive\.ubuntu\.com/s/priority:[0-9][0-9]*/priority:3/' \
              -e '/^https:\/\/archive\.ubuntu\.com/s/priority:[0-9][0-9]*/priority:1/' \
              -e '/security\.ubuntu\.com/s/priority:[0-9][0-9]*/priority:2/' \
              /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium

      - name: Visual smoke gate (dark shell)
        run: npm run test:smoke:theme

      - name: KPI dashboard smoke gate
        run: npx playwright test tests/e2e/kpi-page.spec.ts

      - name: Sub-second navigation performance gate
        run: npm run test:performance

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            test-results
            test-results/smoke
            test-results/performance
            playwright-report
          if-no-files-found: warn

  gate-twilio-token-health:
    # This is a live production contract check. A pull request cannot satisfy
    # behavior that has not been deployed to production yet.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: gate-build-and-theme
    env:
      TWILIO_HEALTH_BASE_URL: ${{ vars.TWILIO_HEALTH_BASE_URL }}
      TWILIO_HEALTH_BEARER: ${{ secrets.TWILIO_HEALTH_BEARER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Twilio health config
        if: env.TWILIO_HEALTH_BASE_URL == ''
        run: |
          echo "TWILIO_HEALTH_BASE_URL is not configured."
          exit 1

      - name: Require Twilio health bearer
        if: env.TWILIO_HEALTH_BEARER == ''
        run: |
          echo "TWILIO_HEALTH_BEARER is not configured."
          exit 1

      - name: Twilio token health gate
        run: node scripts/ci/check-twilio-token-health.mjs

  gate-edge-integrity:
    runs-on: ubuntu-latest
    needs: gate-twilio-token-health
    # Like the Twilio health job, this probes the currently deployed production
    # app and must not demand unreleased branch behavior from a pull request.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      EDGE_INTEGRITY_BASE_URL: ${{ vars.EDGE_INTEGRITY_BASE_URL }}
      EDGE_EXPECT_VERCEL: ${{ vars.EDGE_EXPECT_VERCEL }}
      EDGE_EXPECT_CLOUDFLARE: ${{ vars.EDGE_EXPECT_CLOUDFLARE }}
      TWILIO_HEALTH_BEARER: ${{ secrets.TWILIO_HEALTH_BEARER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require edge integrity config
        if: env.EDGE_INTEGRITY_BASE_URL == ''
        run: |
          echo "EDGE_INTEGRITY_BASE_URL is not configured."
          exit 1

      - name: Require Twilio health bearer
        if: env.TWILIO_HEALTH_BEARER == ''
        run: |
          echo "TWILIO_HEALTH_BEARER is not configured."
          exit 1

      - name: Edge integrity gate
        run: node scripts/ci/check-edge-integrity.mjs
