name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate-build-and-theme:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Route integrity gate
        run: npm run gate:routes

      - name: Theme guard gate
        run: npm run gate:theme

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Visual smoke gate (dark shell)
        run: npm run test:smoke:theme

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            test-results
            test-results/smoke
            playwright-report
          if-no-files-found: warn

  gate-twilio-token-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: gate-build-and-theme
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Twilio token health gate
        env:
          TWILIO_HEALTH_BASE_URL: ${{ vars.TWILIO_HEALTH_BASE_URL }}
          TWILIO_HEALTH_BEARER: ${{ secrets.TWILIO_HEALTH_BEARER }}
        run: node scripts/ci/check-twilio-token-health.mjs
