name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/stabilization-checkpoint-20260503
      - codex/dialer-v2-current-crm
  workflow_dispatch:

jobs:
  gate-build-and-theme:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Unit coverage gate
        run: |
          npm run test:coverage
          npm run gate:kpi-coverage

      - name: Build
        run: npm run build

      - name: Proxy registration gate
        run: npm run gate:proxy

      - name: Route integrity gate
        run: npm run gate:routes

      - name: Theme guard gate
        run: npm run gate:theme

      - name: Dialer ringback gate
        run: node scripts/ci/check-dialer-ringback.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Visual smoke gate (dark shell)
        run: npm run test:smoke:theme

      - name: KPI dashboard smoke gate
        run: npx playwright test tests/e2e/kpi-page.spec.ts

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            test-results
            test-results/smoke
            playwright-report
          if-no-files-found: warn

  gate-twilio-token-health:
    runs-on: ubuntu-latest
    needs: gate-build-and-theme
    env:
      TWILIO_HEALTH_BASE_URL: ${{ vars.TWILIO_HEALTH_BASE_URL }}
      TWILIO_HEALTH_BEARER: ${{ secrets.TWILIO_HEALTH_BEARER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require Twilio health config
        if: env.TWILIO_HEALTH_BASE_URL == ''
        run: |
          echo "TWILIO_HEALTH_BASE_URL is not configured."
          exit 1

      - name: Require Twilio health bearer
        if: env.TWILIO_HEALTH_BEARER == ''
        run: |
          echo "TWILIO_HEALTH_BEARER is not configured."
          exit 1

      - name: Twilio token health gate
        run: node scripts/ci/check-twilio-token-health.mjs

  gate-edge-integrity:
    runs-on: ubuntu-latest
    needs: gate-twilio-token-health
    env:
      EDGE_INTEGRITY_BASE_URL: ${{ vars.EDGE_INTEGRITY_BASE_URL }}
      EDGE_EXPECT_VERCEL: ${{ vars.EDGE_EXPECT_VERCEL }}
      EDGE_EXPECT_CLOUDFLARE: ${{ vars.EDGE_EXPECT_CLOUDFLARE }}
      TWILIO_HEALTH_BEARER: ${{ secrets.TWILIO_HEALTH_BEARER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require edge integrity config
        if: env.EDGE_INTEGRITY_BASE_URL == ''
        run: |
          echo "EDGE_INTEGRITY_BASE_URL is not configured."
          exit 1

      - name: Require Twilio health bearer
        if: env.TWILIO_HEALTH_BEARER == ''
        run: |
          echo "TWILIO_HEALTH_BEARER is not configured."
          exit 1

      - name: Edge integrity gate
        run: node scripts/ci/check-edge-integrity.mjs
